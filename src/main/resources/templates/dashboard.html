<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Admin Dashboard')}"></head>
<body>

<div th:replace="~{fragments/layout :: shell('Admin Dashboard', ~{::section})}">
    <section>
        <!-- Welcome Banner -->
        <div class="card border-0 bg-primary text-white shadow-sm mb-4 rounded-3">
            <div class="card-body p-4 d-flex flex-column flex-md-row justify-content-between align-items-md-center">
                <div>
                    <h4 class="fw-bold mb-1">Welcome to the Admin Panel</h4>
                    <p class="mb-0 opacity-75">
                        Manage students, faculty, and courses with live MySQL database persistence.
                    </p>
                </div>
                <span class="badge bg-light text-primary fs-6 mt-3 mt-md-0 px-3 py-2">
                    Stage 1 Prototype
                </span>
            </div>
        </div>

        <!-- Summary Cards -->
        <div class="row g-4 mb-4">
            <div class="col-sm-6 col-xl-3">
                <div class="card stat-card p-3">
                    <div class="d-flex justify-content-between align-items-center">
                        <div>
                            <p class="text-muted small mb-1">Total Students</p>
                            <h3 class="fw-bold mb-0" th:text="${totalStudents}">0</h3>
                        </div>
                        <div class="bg-primary bg-opacity-10 text-primary p-3 rounded-3">
                            <i class="bi bi-people-fill fs-3"></i>
                        </div>
                    </div>
                </div>
            </div>

            <div class="col-sm-6 col-xl-3">
                <div class="card stat-card p-3">
                    <div class="d-flex justify-content-between align-items-center">
                        <div>
                            <p class="text-muted small mb-1">Total Faculty</p>
                            <h3 class="fw-bold mb-0" th:text="${totalFaculty}">0</h3>
                        </div>
                        <div class="bg-success bg-opacity-10 text-success p-3 rounded-3">
                            <i class="bi bi-person-badge-fill fs-3"></i>
                        </div>
                    </div>
                </div>
            </div>

            <div class="col-sm-6 col-xl-3">
                <div class="card stat-card p-3">
                    <div class="d-flex justify-content-between align-items-center">
                        <div>
                            <p class="text-muted small mb-1">Total Courses</p>
                            <h3 class="fw-bold mb-0" th:text="${totalCourses}">0</h3>
                        </div>
                        <div class="bg-warning bg-opacity-10 text-warning p-3 rounded-3">
                            <i class="bi bi-book-fill fs-3"></i>
                        </div>
                    </div>
                </div>
            </div>

            <div class="col-sm-6 col-xl-3">
                <div class="card stat-card p-3">
                    <div class="d-flex justify-content-between align-items-center">
                        <div>
                            <p class="text-muted small mb-1">Departments</p>
                            <h3 class="fw-bold mb-0" th:text="${totalDepartments}">0</h3>
                        </div>
                        <div class="bg-info bg-opacity-10 text-info p-3 rounded-3">
                            <i class="bi bi-building fs-3"></i>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Quick Actions -->
        <div class="card border-0 shadow-sm rounded-3">
            <div class="card-header bg-white py-3">
                <h6 class="mb-0 fw-bold">Quick Actions (Stage 1 Modules)</h6>
            </div>
            <div class="card-body d-flex flex-wrap gap-3">
                <a th:href="@{/students}" class="btn btn-outline-primary">
                    <i class="bi bi-people me-1"></i> Manage Students
                </a>
                <a th:href="@{/faculty}" class="btn btn-outline-success">
                    <i class="bi bi-person-badge me-1"></i> Manage Faculty
                </a>
                <a th:href="@{/courses}" class="btn btn-outline-dark">
                    <i class="bi bi-book me-1"></i> Manage Courses
                </a>
            </div>
        </div>
    </section>
</div>

<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
