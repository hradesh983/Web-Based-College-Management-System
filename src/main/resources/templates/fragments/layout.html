<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head th:fragment="head(pageTitle)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${pageTitle} + ' | College Management System'">College Management System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>

<body>
<div th:fragment="shell(pageTitle, content)" class="wrapper">
    <!-- Sidebar -->
    <nav id="sidebar" class="sidebar d-flex flex-column">
        <div class="brand d-flex align-items-center gap-2">
            <i class="bi bi-mortarboard-fill text-primary fs-4"></i>
            <span>College CMS</span>
        </div>

        <div class="nav-section">Stage 1 Core</div>
        <ul class="nav flex-column">
            <li class="nav-item">
                <a class="nav-link" th:classappend="${activePage == 'dashboard'} ? 'active'" th:href="@{/dashboard}">
                    <i class="bi bi-speedometer2"></i> Dashboard
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link" th:classappend="${activePage == 'students'} ? 'active'" th:href="@{/students}">
                    <i class="bi bi-people-fill"></i> Students
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link" th:classappend="${activePage == 'faculty'} ? 'active'" th:href="@{/faculty}">
                    <i class="bi bi-person-badge-fill"></i> Faculty
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link" th:classappend="${activePage == 'courses'} ? 'active'" th:href="@{/courses}">
                    <i class="bi bi-book-fill"></i> Courses
                </a>
            </li>
        </ul>

        <div class="nav-section">Stage 2 Modules</div>
        <ul class="nav flex-column mb-auto">
            <li class="nav-item">
                <a class="nav-link disabled opacity-50" href="#" tabindex="-1" aria-disabled="true">
                    <i class="bi bi-building"></i> Departments
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link disabled opacity-50" href="#" tabindex="-1" aria-disabled="true">
                    <i class="bi bi-calendar-check"></i> Attendance
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link disabled opacity-50" href="#" tabindex="-1" aria-disabled="true">
                    <i class="bi bi-journal-check"></i> Examinations
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link disabled opacity-50" href="#" tabindex="-1" aria-disabled="true">
                    <i class="bi bi-megaphone"></i> Notices
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link disabled opacity-50" href="#" tabindex="-1" aria-disabled="true">
                    <i class="bi bi-bar-chart-line"></i> Reports
                </a>
            </li>
        </ul>

        <div class="p-3 border-top border-secondary border-opacity-25 small text-secondary">
            Admin Panel v1.0
        </div>
    </nav>

    <!-- Main Content -->
    <div class="main-content">
        <header class="topbar d-flex justify-content-between align-items-center">
            <div class="d-flex align-items-center gap-3">
                <button id="sidebarToggle" class="btn btn-outline-secondary btn-sm d-md-none" type="button">
                    <i class="bi bi-list"></i>
                </button>
                <h5 class="mb-0 fw-semibold text-dark" th:text="${pageTitle}">Dashboard</h5>
            </div>

            <div class="d-flex align-items-center gap-3">
                <span class="text-muted small">
                    <i class="bi bi-person-circle me-1"></i>
                    <span sec:authentication="name">admin</span>
                </span>
                <form th:action="@{/logout}" method="post" class="m-0">
                    <button type="submit" class="btn btn-outline-danger btn-sm">
                        <i class="bi bi-box-arrow-right me-1"></i> Logout
                    </button>
                </form>
            </div>
        </header>

        <main class="p-4 flex-grow-1">
            <div th:replace="${content}"></div>
        </main>

        <footer class="bg-white border-top py-2 px-4 text-muted small d-flex justify-content-between">
            <span>Web-Based College Management System</span>
            <span>Spring Boot + Thymeleaf + MySQL</span>
        </footer>
    </div>
</div>

<div th:fragment="scripts">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/main.js}"></script>
</div>
</body>
</html>
